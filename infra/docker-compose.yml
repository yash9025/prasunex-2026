version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: learningbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learningbridge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PostgresSuperPassword2026!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learningbridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learningbridge-net

  redis:
    image: redis:7-alpine
    container_name: learningbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learningbridge-net

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: learningbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:PostgresSuperPassword2026!@postgres:5432/learningbridge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-learningbridge-production-secret-key-google-eval-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - learningbridge-net

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: learningbridge-worker
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.modules.jobs.worker", "worker", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:PostgresSuperPassword2026!@postgres:5432/learningbridge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-learningbridge-production-secret-key-google-eval-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learningbridge-net

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: learningbridge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - learningbridge-net

volumes:
  pgdata:
    driver: local

networks:
  learningbridge-net:
    driver: bridge
